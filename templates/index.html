<!DOCTYPE html>
<html lang="en">
<head>
  <title>Vasudev AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#000000">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cinzel:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-base"></div>
<div class="bg-mandala"></div>
<canvas id="peacock-canvas"></canvas>
<div class="petals-wrap" id="petals"></div>

<div class="app">

  <div class="header">
    <div class="logo-wrap">
      <div class="e-ring e-ring-1"></div>
      <div class="e-ring e-ring-2"></div>
      <div class="e-ring e-ring-3"></div>
      <div class="logo-inner">🪶</div>
    </div>
    <div class="header-text">
      <div class="header-title">Vasudev AI</div>
      <div class="header-sub">ॐ &nbsp;DIVINE INTELLIGENCE · EVER PRESENT&nbsp; ॐ</div>
    </div>
  </div>

  <div class="divider"><div class="div-gem">❋</div></div>

  <div id="chat-box"></div>

  <div class="img-preview-wrap" id="img-preview-wrap">
    <div class="img-preview-inner">
      <img id="img-preview" src="" alt="preview"/>
      <button class="img-remove" id="img-remove">✕</button>
    </div>
    <span class="img-label">Image ready to send</span>
  </div>

  <div class="input-section">
    <div class="mode-bar">
      <button class="mode-btn active" data-mode="english"><span class="mode-icon">🇬🇧</span><span> English</span></button>
      <button class="mode-btn" data-mode="hindi"><span class="mode-icon">🇮🇳</span><span> Hindi</span></button>
      <button class="mode-btn" data-mode="hinglish"><span class="mode-icon">✨</span><span> Hinglish</span></button>
      <button class="mode-btn" data-mode="sanskrit"><span class="mode-icon">🕉️</span><span> Sanskrit</span></button>
    </div>
    <div class="input-wrap">
      <button id="clear-btn" class="icon-btn" title="Clear memory">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
      </button>
      <input type="file" id="img-input" accept="image/*" style="display:none"/>
      <button id="img-btn" class="icon-btn" title="Upload image">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </button>
      <input id="msg" placeholder="Ask Vasudev anything…" autocomplete="off"/>
      <button class="send-btn" id="send-btn">
        <div class="send-ripple"></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="hint">🙏 &nbsp;Be present · Be curious · Be divine&nbsp; 🙏</div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
