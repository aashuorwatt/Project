<!DOCTYPE html>
<html lang="en">
<head>
  <title>Vasudev AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:        #c9a84c;
      --gold-light:  #e8cc80;
      --gold-dim:    #7a5f28;
      --bg-deep:     #07060e;
      --bg-mid:      #0e0c1c;
      --bg-panel:    rgba(18, 15, 35, 0.82);
      --text-main:   #f0ece0;
      --text-muted:  #8a8097;
      --accent:      #6b4dff;
      --radius:      16px;
    }

    html, body {
      height: 100%;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      overflow: hidden;
    }

    .cosmos {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(107,77,255,0.28) 0%, transparent 70%),
        radial-gradient(ellipse 55% 45% at 85% 90%,  rgba(201,168,76,0.14) 0%, transparent 65%),
        radial-gradient(ellipse 40% 40% at 10% 80%,  rgba(107,77,255,0.12) 0%, transparent 60%),
        var(--bg-deep);
    }

    .cosmos::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 33% 42%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 11%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 72% 66%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 89% 28%, rgba(255,255,255,0.45) 0%, transparent 100%),
        radial-gradient(1px 1px at 6%  79%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 46% 88%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 82%, rgba(255,255,255,0.4) 0%, transparent 100%);
    }

    .cosmos::after {
      content: '';
      position: absolute;
      width: 900px; height: 900px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(201,168,76,0.04) 60deg,
        transparent 120deg,
        rgba(107,77,255,0.05) 180deg,
        transparent 240deg,
        rgba(201,168,76,0.04) 300deg,
        transparent 360deg
      );
      border-radius: 50%;
      animation: cosmosRotate 60s linear infinite;
    }

    @keyframes cosmosRotate { to { transform: translate(-50%, -50%) rotate(360deg); } }

    .app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 16px 20px;
    }

    .header {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 26px 0 20px;
      flex-shrink: 0;
    }

    .header-emblem {
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, rgba(201,168,76,0.18), rgba(107,77,255,0.18));
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 50%;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(201,168,76,0.2), inset 0 0 12px rgba(201,168,76,0.08);
      animation: emblemPulse 4s ease-in-out infinite;
    }

    @keyframes emblemPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(201,168,76,0.2), inset 0 0 12px rgba(201,168,76,0.08); }
      50%       { box-shadow: 0 0 36px rgba(201,168,76,0.38), inset 0 0 18px rgba(201,168,76,0.15); }
    }

    .header-text {
      display: flex; flex-direction: column; align-items: flex-start;
    }

    .header-title {
      font-family: 'Cinzel', serif;
      font-size: 22px; font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, #a07830 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-sub {
      font-size: 11px; font-weight: 300;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .divider {
      height: 1px; flex-shrink: 0;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      margin-bottom: 18px;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 6px 4px 12px;
      display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }

    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.22); border-radius: 4px; }

    .msg {
      display: flex; align-items: flex-end; gap: 10px;
      animation: msgIn 0.35s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
    }

    .msg.bot .avatar {
      background: linear-gradient(145deg, rgba(201,168,76,0.22), rgba(107,77,255,0.22));
      border: 1px solid rgba(201,168,76,0.3);
      box-shadow: 0 0 10px rgba(201,168,76,0.15);
    }

    .msg.user .avatar {
      background: linear-gradient(145deg, rgba(107,77,255,0.3), rgba(80,50,200,0.3));
      border: 1px solid rgba(107,77,255,0.4);
    }

    .bubble {
      max-width: 74%; padding: 13px 17px;
      border-radius: 18px;
      line-height: 1.65; font-size: 14.5px;
      position: relative;
    }

    .msg.bot .bubble {
      background: var(--bg-panel);
      border: 1px solid rgba(201,168,76,0.16);
      border-bottom-left-radius: 5px;
      backdrop-filter: blur(18px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .msg.user .bubble {
      background: linear-gradient(135deg, rgba(107,77,255,0.36), rgba(70,45,180,0.36));
      border: 1px solid rgba(107,77,255,0.35);
      border-bottom-right-radius: 5px;
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 20px rgba(107,77,255,0.18);
      color: #ddd8ff;
    }

    .typing-dots { display: flex; gap: 5px; padding: 4px 0; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--gold-dim);
      animation: dot 1.3s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.18s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes dot {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40%            { transform: scale(1.1); opacity: 1; }
    }

    .input-wrap {
      flex-shrink: 0;
      position: relative;
      background: var(--bg-panel);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 56px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 0 1px rgba(107,77,255,0.08),
                  0 8px 32px rgba(0,0,0,0.4),
                  inset 0 1px 0 rgba(255,255,255,0.04);
      display: flex; align-items: center;
      padding: 6px 6px 6px 20px;
      gap: 8px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .input-wrap:focus-within {
      border-color: rgba(201,168,76,0.45);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08),
                  0 8px 32px rgba(0,0,0,0.4),
                  inset 0 1px 0 rgba(255,255,255,0.06);
    }

    #msg {
      flex: 1;
      background: transparent; border: none; outline: none;
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px; font-weight: 400;
      line-height: 1.5;
    }

    #msg::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 42px; height: 42px; border-radius: 50%;
      border: none; cursor: pointer; flex-shrink: 0;
      background: linear-gradient(135deg, var(--gold) 0%, #a07028 100%);
      color: #1a1000;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      box-shadow: 0 4px 16px rgba(201,168,76,0.35);
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
      -webkit-appearance: none;
      touch-action: manipulation;
    }

    .send-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 22px rgba(201,168,76,0.5);
    }

    .send-btn:active { transform: scale(0.95); }

    .hint {
      text-align: center; margin-top: 10px;
      font-size: 11px; color: rgba(138,128,151,0.5);
      letter-spacing: 0.05em;
    }

    @media (max-width: 520px) {
      .header-title { font-size: 18px; }
      .bubble { max-width: 86%; font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="cosmos"></div>

<div class="app">

  <div class="header">
    <div class="header-emblem">🕉️</div>
    <div class="header-text">
      <div class="header-title">Vasudev AI</div>
      <div class="header-sub">Divine Intelligence · Ever Present</div>
    </div>
  </div>

  <div class="divider"></div>

  <div id="chat-box"></div>

  <div class="input-wrap">
    <input id="msg" placeholder="Ask something…" autocomplete="off" />
    <button class="send-btn" id="send-btn" title="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <div class="hint">Tap to send · Be present, be curious</div>

</div>

<script src="/static/script.js"></script>
<script>
  // Wire send button reliably for iOS
  document.getElementById('send-btn').addEventListener('click', function(e) {
    e.preventDefault();
    sendMsg();
  });

  // Enter key
  document.getElementById('msg').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  });
</script>
</body>
</html>
