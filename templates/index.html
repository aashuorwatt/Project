<!DOCTYPE html>
<html>
<head>
    <title>Vasudev AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg"></div>

<div class="chat-container">

    <div class="header">
        🕉️ Vasudev AI
    </div>

    <!-- Quick Buttons -->
    <div class="quick-actions">
        <button onclick="quickMsg('Who are you?')">Who are you?</button>
        <button onclick="quickMsg('Motivate me')">Motivate</button>
        <button onclick="quickMsg('Tell me a fact')">Fact</button>
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
        <input id="msg" placeholder="Ask something divine..." />
        <button onclick="sendMsg()">➤</button>
        <button onclick="clearChat()">✖</button>
    </div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
